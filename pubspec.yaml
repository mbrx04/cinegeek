name: cinegeek

description: "CineGeek - App context-aware per cinema e recensioni film"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  geolocator: ^14.0.2
  light: ^4.1.0
  sensors_plus: ^7.0.0
  flutter_local_notifications: ^17.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  circle_nav_bar: ^2.2.0
  flutter_launcher_icons: ^0.14.4
  anim_search_bar: ^2.0.3
  google_fonts: ^8.0.0
  flutter_rating_bar: ^4.0.1
  workmanager: ^0.9.0+3
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_con_sfondo.png
    - assets/images/logo_intero.png
    - assets/images/solo_logo.png
    - assets/images/solo_testo.png
    - assets/file_json/cinema.json